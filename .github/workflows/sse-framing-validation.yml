name: Delegated SSE event framing validation
on:
  push:
    branches: [validation/sse-event-framing-20261116]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    defaults:
      run:
        working-directory: edge0-infer
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: uv sync --project tools/assets
      - name: Reproduce the new concurrency failure on exactly upstream source
        run: |
          for file in tools/cli/serve_delegate_status.cpp tests/unit/cli/strata_registry_test.cpp tests/integration/fake_strata.py tests/integration/serve_strata_test.py; do
            git show "f6bfa5546bcf89919f86946ec669bcc7f4cd526d:edge0-infer/$file" > "$file"
          done
          git -C .. diff --exit-code f6bfa5546bcf89919f86946ec669bcc7f4cd526d -- edge0-infer
          cmake --preset cpu
          cmake --build --preset cpu
          python -u ../validation/sse_runtime_baseline.py
      - name: Check final production files and the complete native suites
        run: |
          for file in tools/cli/serve_delegate_status.cpp tests/unit/cli/strata_registry_test.cpp tests/integration/fake_strata.py tests/integration/serve_strata_test.py; do
            git show "HEAD:edge0-infer/$file" > "$file"
          done
          git -C .. diff --exit-code -- edge0-infer
          cmake --build --preset cpu
          python - <<'PYTEST'
          import hashlib, json, os
          from pathlib import Path
          evidence = json.loads(Path(os.environ['RUNNER_TEMP'], 'sse-unmodified-baseline.json').read_text())
          final = hashlib.sha256(Path('build/cpu/bin/moe_test_edge0_35b_slots_config').read_bytes()).hexdigest()
          print('Slots test binary before/after CLI-only changes:', evidence['slots_binary_sha256'], final)
          assert final == evidence['slots_binary_sha256']
          PYTEST
          build/cpu/bin/moe_test_strata_registry
          python -u ../validation/sse_http.py --label final-with-proven-baseline
          set +e
          ctest --preset cpu --no-tests=error --output-on-failure -L 'L0|L1' --output-junit "$RUNNER_TEMP/sse-final.xml"
          result=$?
          set -e
          echo "final full-suite exit: $result"
          uv run --project tools/assets python - <<'PYTEST'
          import os, json, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP'], 'sse-final.xml'))
          tests = list(root.iter('testcase'))
          failures = {t.attrib['name'] for t in tests if t.find('failure') is not None}
          skipped = [t.attrib['name'] for t in tests if t.find('skipped') is not None]
          previous = json.loads(Path('../validation/sse-baseline-evidence.json').read_text())
          observed = json.loads(Path(os.environ['RUNNER_TEMP'], 'sse-unmodified-baseline.json').read_text())
          permitted = set(previous['unchanged_full_suite_failures'])
          if any(item['failed'] for item in observed['slots']):
              permitted.add('moe_test_edge0_35b_slots_config')
          if observed['weights']['failed']:
              permitted.add('moe_test_weights_mixed')
          print('SSE final full-suite failures:', sorted(failures))
          print('SSE actually reproduced baseline failures:', sorted(permitted))
          print('SSE final runnable passes:', len(tests) - len(failures) - len(skipped))
          print('SSE final device skips:', len(skipped))
          assert failures <= permitted, (failures, permitted)
          PYTEST
          ctest --preset cpu --no-tests=error --output-on-failure -L L2 -R strata

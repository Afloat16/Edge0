name: JSON Linux regression validation
on:
  push:
    branches: [validation/json-binary64-20261116]
permissions:
  contents: read
jobs:
  json:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: edge0-infer
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: uv sync --project tools/assets
      - name: Reproduce the finite overflow on upstream
        run: |
          cp src/model/json.cpp "$RUNNER_TEMP/json-fixed.cpp"
          git show f6bfa5546bcf89919f86946ec669bcc7f4cd526d:edge0-infer/src/model/json.cpp > src/model/json.cpp
          cmake --preset cpu
          cmake --build --preset cpu --target moe_json_probe
          if uv run --project tools/assets python tests/unit/model/check_json.py build/cpu/bin/moe_json_probe > "$RUNNER_TEMP/json-before.log" 2>&1; then
            cat "$RUNNER_TEMP/json-before.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/json-before.log"
          grep -F "'2e+308'" "$RUNNER_TEMP/json-before.log"
      - name: Check all ordered JSON comparisons and rejection cases
        run: |
          cp "$RUNNER_TEMP/json-fixed.cpp" src/model/json.cpp
          cmake --build --preset cpu --target moe_json_probe
          uv run --project tools/assets python tests/unit/model/check_json.py build/cpu/bin/moe_json_probe

name: Desktop SSE completion validation
on:
  push:
    branches: [validation/sse-completion-20261116]
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '26.3.1']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: '0'
      EDGE0_VALIDATION_REPOSITORY: ${{ github.workspace }}
    defaults:
      run:
        working-directory: edge0-infer/examples/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git fetch --no-tags --depth=1 origin f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: Reproduce all four regressions on upstream
        run: |
          cp src/chat.ts "$RUNNER_TEMP/chat-fixed.ts"
          git show f6bfa5546bcf89919f86946ec669bcc7f4cd526d:edge0-infer/examples/desktop/src/chat.ts > src/chat.ts
          if npm test -- src/chat-completion.test.ts --reporter=json --outputFile="$RUNNER_TEMP/sse-before.json" > "$RUNNER_TEMP/sse-before.log" 2>&1; then
            cat "$RUNNER_TEMP/sse-before.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/sse-before.log"
          node --input-type=module - <<'JSTEST'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/sse-before.json`, 'utf8'));
          assert.equal(result.numFailedTests, 4);
          assert.equal(result.numPassedTests, 0);
          console.log('Upstream reproduced all four expected failures.');
          JSTEST
      - name: Validate all frontend tests, build, and real HTTP completion
        run: |
          cp "$RUNNER_TEMP/chat-fixed.ts" src/chat.ts
          npm test
          npm run build
          node ../../../validation/sse-http.mjs

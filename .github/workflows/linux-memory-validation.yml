name: Linux process memory validation
on:
  push:
    branches: [validation/linux-memory-coverage-20261116]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: edge0-infer
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: uv sync --project tools/assets
      - name: Reproduce unsupported-platform assertion on Linux
        run: |
          cp tests/unit/platform/memory_test.cpp "$RUNNER_TEMP/memory-test-fixed.cpp"
          git show f6bfa5546bcf89919f86946ec669bcc7f4cd526d:edge0-infer/tests/unit/platform/memory_test.cpp > tests/unit/platform/memory_test.cpp
          cmake --preset cpu
          cmake --build --preset cpu
          uv run --project tools/assets python - <<'PYTEST'
          import subprocess, os, json
          from pathlib import Path
          result = subprocess.run(['build/cpu/bin/moe_test_platform_memory'], capture_output=True, text=True)
          print(result.stdout, end='')
          print(result.stderr, end='')
          assert result.returncode != 0
          assert 'check failed: !before.rss.values && !before.rss.reason.empty()' in result.stderr
          # The untouched weights test has an independently reproduced lifetime race.
          weight_failures = 0
          for attempt in range(100):
              result = subprocess.run(['build/cpu/bin/moe_test_weights_mixed'], capture_output=True, text=True)
              if result.returncode:
                  assert 'budget.current(exec::Purpose::resident_weights)' in result.stderr, result.stderr
                  weight_failures += 1
          print('Unmodified mixed-storage failures out of 100:', weight_failures)
          assert weight_failures > 0, 'Existing mixed-storage race did not reproduce'
          Path(os.environ['RUNNER_TEMP'], 'weights-baseline.json').write_text(json.dumps({'failures': weight_failures}))
          PYTEST
      - name: Verify live Linux metrics and allocation growth
        run: |
          cp "$RUNNER_TEMP/memory-test-fixed.cpp" tests/unit/platform/memory_test.cpp
          cmake --build --preset cpu
          uv run --project tools/assets python - <<'PYTEST'
          import subprocess
          for attempt in range(20):
              print(f'Native Linux memory sample {attempt + 1}', flush=True)
              subprocess.run(['build/cpu/bin/moe_test_platform_memory'], check=True)
          PYTEST
          set +e
          ctest --preset cpu --no-tests=error --output-on-failure -L 'L0|L1' --output-junit "$RUNNER_TEMP/memory-after.xml"
          after=$?
          set -e
          echo "full-suite exit: $after"
          uv run --project tools/assets python - <<'PYTEST'
          import os, json, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'memory-after.xml'))
          failures = {test.attrib['name'] for test in root.iter('testcase') if test.find('failure') is not None}
          expected = {'moe_test_ordered_json', 'moe_test_template_tools'}
          if json.loads(Path(os.environ['RUNNER_TEMP'], 'weights-baseline.json').read_text())['failures']:
              expected.add('moe_test_weights_mixed')
          print('Full-suite failures:', sorted(failures))
          print('Previously reproduced baseline failures:', sorted(expected))
          assert failures <= expected, (failures, expected)
          PYTEST
